services:
  postgres:
    image: postgres:16-alpine
    container_name: proplanding-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: proplanding
      POSTGRES_PASSWORD: proplanding
      POSTGRES_DB: proplanding
    volumes:
      - proplanding_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proplanding -d proplanding"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  proplanding_pgdata:
